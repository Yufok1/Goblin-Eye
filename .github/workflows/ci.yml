name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the release workflow needs write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  dashboard:
    name: Dashboard build is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the pinned compiler
        run: npm ci --ignore-scripts
      - name: Rebuild the dashboard
        run: npm run build
      - name: The committed web/dist must match a fresh build
        run: git diff --exit-code -- web/dist

  release-artifacts:
    name: Build and verify the Windows ZIP
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify the committed Python runtime against its pin
        run: py -3 scripts/fetch_python.py --check
      - name: Build the release archive
        run: py -3 scripts/build_release.py
      - name: Verify the archive as a recipient receives it
        run: py -3 scripts/verify_release.py
      - name: Upload the verified archive
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/Goblin-Eye-*-Windows.zip
            dist/Goblin-Eye-*-Windows.zip.sha256
            dist/Goblin-Eye-*-Windows.validation.json
          if-no-files-found: error

  wow-ai:
    name: Optional chat tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        working-directory: wow-ai
        run: npm ci --ignore-scripts
      - name: Test addon, bridge, speech and setup
        working-directory: wow-ai
        run: npm test
      - name: Generated addon must match source modules
        run: git diff --exit-code -- wow-ai/addon/WoWAI/WoWAI.lua
