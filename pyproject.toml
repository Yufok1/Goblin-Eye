[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goblin-eye"
version = "0.2.0"
description = "Local-first economic research for World of Warcraft: Forever"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Goblin Eye contributors"}]
dependencies = []

[project.scripts]
goblin-eye = "goblin_eye.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

